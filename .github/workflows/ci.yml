name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Vet
        run: go vet ./...

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Unit tests with race detector and coverage
        run: go test -race -coverprofile=coverage.out ./... -count=1

      - name: BDD (godog)
        run: go test ./features/... -count=1

      - name: Build binary
        run: go build -trimpath -ldflags "-s -w" -o h2-ui ./cmd/h2-ui

      - name: Smoke test
        run: bash scripts/smoke.sh ./h2-ui

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build release archives
        run: make release
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
